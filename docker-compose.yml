services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ohmyhindustan
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/ohmyhindustan?schema=public
      - JWT_SECRET=your_super_secret_jwt_key_change_this_for_production
      - PORT=3000
    depends_on:
      - postgres

volumes:
  postgres_data:

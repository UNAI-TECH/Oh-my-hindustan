<!DOCTYPE html>
<html>
<head>
    <title>Auth Redirect - Oh My Hindustan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #E53935, #FB8C00);
            color: white;
            text-align: center;
        }
        .container {
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px; }
        p { opacity: 0.9; margin: 0; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 32px;
            background: white;
            color: #E53935;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }
        .btn:hover { opacity: 0.9; }
        #manual-section { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🇮🇳 Oh My Hindustan</h2>
        <div class="spinner"></div>
        <p>Redirecting back to the app...</p>
        <div id="manual-section">
            <p>If the app didn't open automatically:</p>
            <button class="btn" id="open-btn">Open App</button>
        </div>
    </div>

    <script>
        // Build the deep link URL that the app expects
        // The app's WebBrowser.openAuthSessionAsync is listening for URLs
        // that start with "app://auth/callback"
        // Supabase sends tokens in the URL hash fragment: #access_token=...&refresh_token=...

        const hash = window.location.hash;   // e.g. #access_token=xxx&refresh_token=yyy
        const search = window.location.search; // e.g. ?access_token=xxx (less common)
        const params = hash || search || '';

        // Construct the deep link: app://auth/callback#access_token=...
        const deepLink = 'app://auth/callback' + params;

        console.log('Hash:', hash);
        console.log('Search:', search);
        console.log('Deep link:', deepLink);

        // Try to open via the app scheme immediately
        window.location.replace(deepLink);

        // After 3 seconds, show manual button as fallback
        setTimeout(function() {
            document.getElementById('manual-section').style.display = 'block';
            document.getElementById('open-btn').onclick = function() {
                window.location.replace(deepLink);
            };
        }, 3000);
    </script>
</body>
</html>

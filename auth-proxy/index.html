<!DOCTYPE html>
<html>
<head>
    <title>Auth Redirect - Oh My Hindustan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #E53935, #FB8C00);
            color: white;
            text-align: center;
        }
        .container { padding: 40px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px; }
        p { opacity: 0.9; margin: 0; }
        .btn {
            display: inline-block; margin-top: 24px; padding: 14px 32px;
            background: white; color: #E53935; border-radius: 12px;
            text-decoration: none; font-weight: 700; font-size: 16px;
            cursor: pointer; border: none;
        }
        #manual-section { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🇮🇳 Oh My Hindustan</h2>
        <div class="spinner"></div>
        <p>Redirecting back to the app...</p>
        <div id="manual-section">
            <p>If the app didn't open automatically:</p>
            <button class="btn" id="open-btn">Open App</button>
        </div>
    </div>

    <script>
        // The app passes its own redirect URL as ?appRedirect=... in the Supabase redirectTo.
        // Supabase appends the tokens in the hash fragment: #access_token=xxx&refresh_token=yyy
        // We need to combine: appRedirect + hash fragment → deep link back to the app.

        var hash = window.location.hash || '';     // #access_token=xxx&refresh_token=yyy
        var search = window.location.search || ''; // ?appRedirect=exp%3A%2F%2F...

        // Extract appRedirect from query string
        var searchParams = new URLSearchParams(search);
        var appRedirect = searchParams.get('appRedirect');

        var deepLink = '';

        if (appRedirect) {
            // Use the exact redirect URL the app provided + append the hash tokens
            deepLink = decodeURIComponent(appRedirect) + hash;
        } else {
            // Fallback: try app:// scheme
            deepLink = 'app://auth/callback' + hash;
        }

        console.log('App redirect param:', appRedirect);
        console.log('Hash fragment:', hash);
        console.log('Final deep link:', deepLink);

        // Redirect immediately
        window.location.replace(deepLink);

        // Show manual button after 3 seconds as fallback
        setTimeout(function() {
            document.getElementById('manual-section').style.display = 'block';
            document.getElementById('open-btn').onclick = function() {
                window.location.replace(deepLink);
            };
        }, 3000);
    </script>
</body>
</html>
